[package]
name = "dnsm"
version = "0.2.1"
edition = "2024"
authors = ["Raphael <kontor@dnsm.re>"]
repository = "https://github.com/k-o-n-t-o-r/dnsm"
license = "MIT"
description = "Toolkit for covert data exfiltration using DNS"
readme = "README.md"
homepage = "https://dnsm.re"
keywords = ["gdpr", "itsec", "security", "exfiltration", "telemetry"]
categories = [
    "security",
    "command-line-utilities",
    "network-programming",
    "development-tools",
]

[dependencies]
lzma-rust2 = "0.25.0"
blake3 = { version = "1.8.7" }

clap = { version = "4.6.7", features = [
    "derive",
    "wrap_help",
], optional = true }
console = { version = "0.16.6", optional = true }
fastrand = { version = "2.5.0", optional = true }

rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
tokio = { version = "1.54.1", features = [
    "macros",
    "sync",
    "rt-multi-thread",
], optional = true }
tokio-stream = { version = "0.1.19", optional = true }
warp = { version = "0.4.3", features = [
    "websocket",
    "server",
], optional = true }
futures = { version = "0.3.34", default-features = false, optional = true }
base64 = { version = "0.23.1", optional = true }
serde_json = { version = "1.0.154", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

pyo3 = { version = "0.30", features = ["extension-module"], optional = true }

[lib]
name = "dnsm"
crate-type = ["rlib", "cdylib"]

[features]
default = ["native-cli"]

native-cli = ["dep:clap", "dep:console", "dep:fastrand"]

sqlite = ["dep:rusqlite"]

python = ["dep:pyo3"]

ws-server = [
    "dep:tokio",
    "dep:tokio-stream",
    "dep:warp",
    "dep:futures",
    "dep:base64",
    "dep:serde_json",
    "dep:serde",
]

[dev-dependencies]
fastrand = "2.5.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[[bin]]
name = "dnsm"
path = "src/bin/dnsm.rs"
required-features = ["native-cli"]

[[bin]]
name = "dnsm-server"
path = "src/bin/dnsm_server/main.rs"
required-features = ["native-cli", "sqlite"]

[[bin]]
name = "dnsm-ws"
path = "src/bin/dnsm_ws.rs"
required-features = ["native-cli", "sqlite", "ws-server"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
blake3 = { version = "1.8.7", features = ["wasm32_simd"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
